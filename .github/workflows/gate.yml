name: gate

on:
  workflow_call:

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DBPRINT_TEST_DIST: load
    steps:
      - name: Install what the recipes assume is present
        run: |
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git locales \
            postgresql postgresql-client mariadb-server mariadb-client

          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs

          curl -LsSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          locale-gen en_US.UTF-8

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the site's node dependencies, for the packaged-link cross-check test
        run: cd site && npm ci

      - name: Install dependencies
        run: just install

      - name: Fail if the resolution did not match the committed lockfile
        run: git diff --exit-code uv.lock

      - name: Lint, type-check and test
        run: just check

      - name: Upload the gate's own logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            /tmp/dbprint--install.log
            /tmp/dbprint--test.log
            /tmp/dbprint--lint.log
          if-no-files-found: error

