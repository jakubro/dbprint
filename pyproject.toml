[project]
name = "dbprint"
dynamic = ["version"]
description = "Offline database prints — DDL snapshots and column statistics, committed to git."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jakub Roman" }]
keywords = ["database", "schema", "profiling", "snowflake", "postgresql", "mysql", "cli", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "click>=8.0",
  "jsonschema>=4.20",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "rich-click>=1.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.16.3",
  "ty>=0.0.73",
  "duckdb>=1.0",
  "psycopg[binary]>=3.2",
  "mysql-connector-python>=26.7",
  "pytest-xdist>=3.8.0",
]
postgres = [
  "psycopg[binary]>=3.2",
]
mysql = [
  "mysql-connector-python>=26.7",
]
snowflake = [
  "cryptography>=50.0",
  "snowflake-connector-python>=3.6",
]
mcp = [
  "mcp>=2,<3",
]
docs = [
  "flask>=3.0",
  "markdown>=3.6",
  "inflect>=7.0",
]

[project.scripts]
dbprint = "dbprint.cli:main"

[project.urls]
Homepage = "https://github.com/jakubro/dbprint"
Repository = "https://github.com/jakubro/dbprint"
Issues = "https://github.com/jakubro/dbprint/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dbprint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dbprint"]

# Each specification ships inside the package it governs, so a citation printed by `check`
# resolves for a reader who installed from an index rather than cloning.
[tool.hatch.build.targets.wheel.force-include]
"docs/format/v1/SPEC.md" = "dbprint/spec/v1/SPEC.md"
"docs/ASSERTIONS.md" = "dbprint/assertions/ASSERTIONS.md"

[tool.coverage.run]
data_file = "/tmp/.coverage-dbprint"
branch = true
parallel = true

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/.pytest_cache-dbprint"
