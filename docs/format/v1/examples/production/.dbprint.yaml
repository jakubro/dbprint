# Reference project config exercising the v1 schema.
#
# Shape: `defaults` cascade into each connection, and each matching rule merges over
# both, in order: maps merge key by key, the later value wins, a list replaces.
# Every key dbprint reads appears below. The two that would narrow the read are
# commented out.
#
# Every key, with types and defaults: ../../../../CONFIG.md

defaults:
  profile:
    freshness:
      max_age_days: 7
    statistics:
      enumeration_threshold: 50
      top_n_values: 20
      percentiles: [1, 25, 50, 75, 99]
    read:
      tables: {mode: full}
      views: {mode: catalog}
    looks_like: {enabled: true, sample_size: 1000}
    null_patterns: {enabled: true, top_n: 20}
    parts: {enabled: true, max: 20, max_depth: 3}
    timeline: {enabled: true}
    sketches: {enabled: true, columns: required}
    relationships: {infer: true}
  diff:
    stat_change_threshold:
      cardinality_ratio: 0.02
      percentile_pct: 0.05
      values_coverage: 0.05
      default: 0.01

connections:
  production:
    adapter: postgres
    auto: true
    output: prints
    tables:
      include:
        - "arboretum.seedbank.*"
        - "arboretum.fixture.*"
      exclude:
        - "arboretum.seedbank.audit_*"
    profile:
      freshness:
        max_age_days: 1
      statistics:
        top_n_values: 30

      # Withhold the literals of anything detected as personal data. Keyed on the
      # category rather than on a column glob: the category covers the columns a
      # schema has not grown yet, while `columns` globs over `<fqn>.<column>` - the
      # escape hatch for a column detection misses. The last matching rule decides
      # the primitive.
      redact:
        - sensitivity: [contact]
          with: mask
        - sensitivity: [online_identifier]
          with: mask
        - columns: ["arboretum.seedbank.collector.institution"]
          with: hash
        - columns: ["arboretum.seedbank.collector.street_address"]
          with: drop

    # Per-table overrides. Every matching entry applies in order; later wins.
    # Each table is read in one mode: full, sample, filter or catalog.
    rules:
      # The matview is expensive to profile, so it is refreshed monthly rather
      # than daily and its timeline is switched off. Its manifest entry records
      # the 30 it resolved to and the timeline it switched off, and its
      # statistics.yaml names `timeline` in `disabled`.
      - match: {tables: ["arboretum.seedbank.germination_by_taxon_mv"]}
        profile:
          freshness: {max_age_days: 30}
          timeline: {enabled: false}

#      - match: {tables: ["arboretum.seedbank.events*"]}
#        profile: {read: {tables: {mode: sample, fraction: 0.01}}}
